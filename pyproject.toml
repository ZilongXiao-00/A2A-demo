[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a2a-demo"
version = "0.1.0"
description = "A lightweight multi-agent demo for the Agent2Agent protocol."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "a2a-sdk[http-server]==0.3.26",
    "google-adk==2.1.0",
    "openai==2.38.0",
    "httpx==0.28.1",
    "uvicorn==0.48.0",
]

[tool.setuptools.packages.find]
where = ["src"]

